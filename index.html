<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GODs Turf — Book Your Slot</title>
  <style>
    :root{--accent:#16a34a;--muted:#6b7280}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial;}
    .site-accent{background:var(--accent) !important;color:#fff !important}
    .site-accent-text{color:var(--accent) !important}
    .site-accent-border{border-color:var(--accent) !important}
    .container{max-width:1100px;margin:20px auto;padding:16px}
    .card{background:#fff;border-radius:12px;padding:16px;border:1px solid #e6e6e6}
    .flex{display:flex}
    .items-center{align-items:center}
    .justify-between{justify-content:space-between}
    .gap-2{gap:8px}
    .mb-3{margin-bottom:12px}
    .rounded-lg{border-radius:8px}
    .rounded-xl{border-radius:12px}
    .text-sm{font-size:14px}
    .text-xs{font-size:12px}
    .p-3{padding:12px}
    .p-4{padding:16px}
    .mt-4{margin-top:16px}
    .hidden{display:none}
    /* timeline specific */
    .timeline-container{overflow-x:auto;padding:8px 4px}
    .slot-chip{border:1px solid #e5e7eb;background:#f8fafc;padding:8px;border-radius:10px;min-width:84px;margin-right:8px}
    .slot-chip.site-accent{background:var(--accent);color:#fff;border-color:transparent}
    .slot-selected{background:var(--accent);color:#fff;border-color:transparent}
  </style>
</head>
<body style="background:#f8fafc;margin:0;">
  <div class="container">
    <header class="card mb-3" style="display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center;font-weight:700;">GT</div>
        <div>
          <div style="font-weight:700;font-size:18px;">GODs Turf</div>
          <div style="font-size:13px;color:#6b7280;">Book your slot • Live availability • WhatsApp support</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button style="background:transparent;border:1px solid #e5e7eb;padding:8px 10px;border-radius:8px;">Directions</button>
        <a href="tel:+917003396909" style="background:#fff;border-radius:8px;padding:8px 10px;border:1px solid #e5e7eb;color:var(--accent);text-decoration:none;">+91 70033 96909</a>
      </div>
    </header>

    <!-- Main layout -->
    <main class="flex" style="gap:16px;">
      <!-- Left column -->
      <div style="flex:2;display:flex;flex-direction:column;gap:16px;">
        <!-- Date input (existing) hidden, keep for compatibility -->
        <div class="card" style="display:flex;flex-direction:column;gap:12px;">
          <label class="text-sm">Choose date</label>
          <input id="date" type="date" style="padding:10px;border-radius:8px;border:1px solid #e5e7eb;width:160px;" />
          <div id="dateRow"></div>
        </div>

        <!-- Pitch selector container will be inserted by app.js -->
        <div id="pitchSelectorContainer" class="card"></div>

        <!-- Slots panel -->
        <div id="slotsArea" class="card">
          <h3 style="margin:0 0 8px 0;font-weight:600;">Available slots</h3>
          <div id="slotTabs"></div>
          <div id="slotPanel" style="margin-top:12px;"></div>
        </div>
      </div>

      <!-- Right column -->
      <aside style="flex:1;">
        <div class="card">
          <div id="selectedPitch">Selected pitch</div>
          <div id="selectedPrice" style="margin-top:8px;font-weight:700;">₹0</div>
          <div style="margin-top:12px;font-size:12px;color:#6b7280;">Tip: Use WhatsApp button to message admin for special requests.</div>
        </div>
      </aside>
    </main>

    <!-- confirmation card -->
    <div id="confirmCard" class="card hidden" style="margin-top:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div id="c-id" style="font-weight:700;"></div>
          <div id="c-when" class="text-sm"></div>
          <div id="c-court" class="text-sm"></div>
        </div>
        <div id="c-amount" style="font-weight:700;"></div>
      </div>
    </div>
  </div>

  <!-- modal (hidden by default) -->
  <div id="modal" class="hidden" style="position:fixed;left:0;right:0;top:0;bottom:0;display:flex;align-items:flex-end;justify-content:center;padding:20px;z-index:9999;">
    <div style="background:white;border-radius:12px;padding:16px;width:100%;max-width:520px;box-shadow:0 6px 24px rgba(2,6,23,0.08);">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div id="m-title" style="font-weight:700;">Booking</div>
        <button id="closeModal" style="background:transparent;border:0;font-size:18px;">✕</button>
      </div>
      <div id="m-when" style="margin-top:8px;color:#6b7280;"></div>
      <div id="m-price" style="margin-top:8px;font-weight:700;"></div>

      <div style="margin-top:12px;">
        <input id="m-name" placeholder="Your name" style="width:100%;padding:10px;border-radius:8px;border:1px solid #e5e7eb;margin-bottom:8px;">
        <input id="m-phone" placeholder="+91 9xxxxxxxxx" style="width:100%;padding:10px;border-radius:8px;border:1px solid #e5e7eb;margin-bottom:8px;">
        <textarea id="m-notes" placeholder="Notes (optional)" style="width:100%;padding:10px;border-radius:8px;border:1px solid #e5e7eb;margin-bottom:8px;"></textarea>
      </div>

      <div style="display:flex;gap:8px;margin-top:12px;">
        <button id="m-confirm" style="flex:1;padding:10px;border-radius:8px;background:var(--accent);color:#fff;border:0;">Confirm</button>
        <button id="m-cancel" style="flex:1;padding:10px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="./scripts/app.js"></script>
</body>
</html>
